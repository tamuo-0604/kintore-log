# web/ フォルダ（PWA）を GitHub Pages に公開します。
# 事前にリポジトリの Settings → Pages → Source を「GitHub Actions」にしてください。
name: Deploy PWA
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # 公開のたびに目印を書き込む。アプリの「バージョン」表示と、古い保存データの入れ替えに使う
      - name: Stamp build
        run: |
          BUILD="$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M') (${GITHUB_SHA::7})"
          sed -i "s/__BUILD__/${BUILD}/g" web/app.js web/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
